# Render Blueprint for vedic-astro.
# Connecting this file in the Render dashboard ("New + > Blueprint")
# makes the deployment reproducible instead of dashboard-only:
# the service below mirrors the existing live service.
services:
  - type: web
    name: vedic-astro
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
